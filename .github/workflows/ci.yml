name: CI

on:
  push:
    branches: [development, staging, production, main]
  pull_request:
    branches: [development, staging, production, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleansheet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: CI / frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: CI=true yarn test --watchAll=false
      - run: yarn build

  backend:
    name: CI / backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: DATABASE_URL=sqlite:////tmp/cleansheet-ci.db pytest -n 0 --ignore=tests/backend_test.py
        working-directory: backend
